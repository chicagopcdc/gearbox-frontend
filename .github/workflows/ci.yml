name: CI - Lint & Type Check

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint || npx eslint src --ext .ts,.tsx
        
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        
      - name: Check formatting with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,json}"